# Naming only: this catalog never adds rules or changes their destinations.
# Unlisted domains/processes keep working as explicit, readable rules.
version: 1
services:
  apple:
    title: Apple / iCloud
    domains: [apple.com, icloud.com, mzstatic.com, aaplimg.com, apple-dns.net, cdn-apple.com]
    networks: [17.0.0.0/8]
