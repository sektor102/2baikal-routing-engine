name: Verify and publish 2Baikal routing

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: 2baikal-routing
  cancel-in-progress: false

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependency
        run: python -m pip install -r requirements.txt
      - name: Offline tests and smoke build
        run: make test
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/upstream
          key: upstream-verified-${{ runner.os }}-${{ github.run_id }}
          restore-keys: upstream-verified-${{ runner.os }}-
      - name: Pinned official Mihomo and Xray
        run: make tools
      - name: Download, verify format and required categories
        run: make fetch
      - name: Restore previous published metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py restore --repository "$GITHUB_REPOSITORY"
      - name: Inventory and compile client artifacts
        run: |
          make audit
          make build REPOSITORY="$GITHUB_REPOSITORY"
      - name: Rendered routing, schema and native core validation
        run: make validate
      - name: Coverage diff and changelog
        run: python scripts/report.py
      - name: Prepare verified release assets
        run: python scripts/release.py prepare
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/upstream
          key: upstream-verified-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-routing-${{ github.run_id }}
          path: |
            release-assets/
            reports/
          retention-days: 30
      - name: Publish only changed, validated main payload
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          python scripts/release.py publish --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA"
      - name: Sync published PC, Router and HAPP profiles to Remnawave
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REMNAWAVE_URL: ${{ secrets.REMNAWAVE_URL }}
          REMNAWAVE_API_TOKEN: ${{ secrets.REMNAWAVE_API_TOKEN }}
          REMNAWAVE_MIHOMO_TEMPLATE_UUID: ${{ secrets.REMNAWAVE_MIHOMO_TEMPLATE_UUID }}
          REMNAWAVE_ROUTER_TEMPLATE_UUID: ${{ secrets.REMNAWAVE_ROUTER_TEMPLATE_UUID }}
        run: python scripts/sync_remnawave.py --if-configured
